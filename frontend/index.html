<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>HánzìTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="app.js"></script>
  
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
  
  <style>
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    input, button { font-size: 16px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
<main x-data="app()" x-init="init()" class="max-w-xl mx-auto pb-20">

  <section x-show="view === 'add'" x-cloak>
    <div class="sticky top-0 bg-slate-50 z-10 p-3 border-b border-slate-200">
      <input
        type="search"
        x-model="searchQ"
        @input.debounce.180ms="runSearch()"
        placeholder="Type pinyin... (e.g. pengyou)"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        class="w-full px-4 py-3 text-lg rounded-xl border border-slate-300 bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div x-show="candidates.length > 0" class="p-3 space-y-2">
      <template x-for="(c, i) in candidates" :key="i">
        <button
          @click="openSaveModal(c)"
          class="block w-full text-left p-4 bg-white rounded-xl shadow-sm hover:bg-blue-50 active:bg-blue-100 border border-slate-200">
          <div class="text-2xl font-bold leading-tight" x-text="c.hanzi"></div>
          <div class="text-sm text-slate-600 mt-0.5" x-text="toneMark(c.pinyin)"></div>
          <div class="text-sm text-slate-800 mt-1" x-text="c.english"></div>
        </button>
      </template>
    </div>

    <div x-show="searchQ.trim().length > 0 && candidates.length === 0 && !searching"
         class="p-4 text-center text-slate-500 text-sm">No matches.</div>

    <div x-show="searchQ.trim().length === 0" class="p-3">
      <h2 class="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-2 px-1">Recent</h2>
      <p x-show="recent.length === 0" class="text-sm text-slate-500 px-1">
        Nothing saved yet — type pinyin above to add your first word.
      </p>
      <ul class="space-y-2">
        <template x-for="v in recent" :key="v.id">
          <li class="bg-white rounded-xl p-3 border border-slate-200">
            <div class="text-xl font-semibold" x-text="v.hanzi"></div>
            <div class="text-xs text-slate-600" x-text="toneMark(v.pinyin)"></div>
            <div class="text-xs text-slate-700 mt-0.5" x-text="v.english"></div>
            <div x-show="v.categories.length" class="flex flex-wrap gap-1 mt-1.5">
              <template x-for="cat in v.categories" :key="cat">
                <span class="px-2 py-0.5 text-[10px] bg-slate-100 text-slate-700 rounded-full" x-text="cat"></span>
              </template>
            </div>
          </li>
        </template>
      </ul>
    </div>
  </section>

  <section x-show="view === 'bank'" x-cloak>
    <div class="sticky top-0 bg-slate-50 z-10 p-3 border-b border-slate-200">
      <div class="flex gap-2 overflow-x-auto no-scrollbar">
        <button
          @click="selectFilter('')"
          :class="bankFilter === '' ? 'bg-blue-600 text-white' : 'bg-white text-slate-700 border border-slate-300'"
          class="px-3 py-1.5 rounded-full text-sm whitespace-nowrap">All</button>
        <template x-for="cat in allCategories" :key="cat">
          <button
            @click="selectFilter(cat)"
            :class="bankFilter === cat ? 'bg-blue-600 text-white' : 'bg-white text-slate-700 border border-slate-300'"
            class="px-3 py-1.5 rounded-full text-sm whitespace-nowrap"
            x-text="cat"></button>
        </template>
      </div>
    </div>

    <ul class="p-3 space-y-3">
      <template x-for="v in bankResults" :key="v.id">
        <li x-data="{showEng: false, showSent: false}" class="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <button @click="showEng = !showEng" class="w-full text-left p-4">
            <div class="text-3xl font-bold leading-none" x-text="v.hanzi"></div>
            <div class="text-sm text-slate-600 mt-1.5" x-text="toneMark(v.pinyin)"></div>
            <div x-show="showEng" class="text-base text-slate-800 mt-2" x-text="v.english"></div>
            <div x-show="!showEng" class="text-xs text-slate-400 italic mt-1.5">tap to reveal</div>
            <div x-show="v.categories.length" class="flex flex-wrap gap-1 mt-2.5">
              <template x-for="cat in v.categories" :key="cat">
                <span class="px-2 py-0.5 text-[11px] bg-slate-100 text-slate-700 rounded-full" x-text="cat"></span>
              </template>
            </div>
          </button>
          <div x-show="v.sentences.length" class="border-t border-slate-100">
            <button @click="showSent = !showSent" class="w-full text-left px-4 py-2.5 text-xs font-medium text-blue-600">
              <span x-show="!showSent">Show <span x-text="v.sentences.length"></span> example<span x-show="v.sentences.length > 1">s</span></span>
              <span x-show="showSent">Hide examples</span>
            </button>
            <div x-show="showSent" class="px-4 pb-3 space-y-2">
              <template x-for="(s, i) in v.sentences" :key="i">
                <div class="text-sm">
                  <div class="text-slate-900" x-text="s.chinese"></div>
                  <div class="text-slate-500 italic text-xs mt-0.5" x-text="s.english"></div>
                </div>
              </template>
            </div>
          </div>
        </li>
      </template>
    </ul>

    <p x-show="bankResults.length === 0" class="p-6 text-center text-slate-500 text-sm">
      No words<span x-show="bankFilter !== ''"> in this category</span> yet.
    </p>
  </section>

  <div x-show="modal" x-cloak class="fixed inset-0 z-20" @keydown.escape.window="closeModal()">
    <div class="absolute inset-0 bg-black/40" @click="closeModal()"></div>
    <div class="absolute bottom-0 inset-x-0 bg-white rounded-t-2xl p-4 pb-8 max-h-[85vh] overflow-y-auto"
         x-transition:enter="transition transform ease-out duration-200"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0">
      <div class="w-12 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
      <template x-if="modal">
        <div>
          <div class="text-3xl font-bold" x-text="modal.hanzi"></div>
          <div class="text-sm text-slate-600 mt-0.5" x-text="toneMark(modal.pinyin)"></div>
          <div class="text-sm text-slate-800 mt-1" x-text="modal.english"></div>

          <h3 class="text-xs uppercase tracking-wide text-slate-500 font-semibold mt-5 mb-2">Tag with categories</h3>
          <div x-show="allCategories.length === 0" class="text-xs text-slate-500 italic mb-2">
            No categories yet. Create one below.
          </div>
          <div class="flex flex-wrap gap-2">
            <template x-for="cat in allCategories" :key="cat">
              <button
                type="button"
                @click="toggleCategory(cat)"
                :class="modalCategories.includes(cat) ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'"
                class="px-3 py-1.5 rounded-full text-sm"
                x-text="cat"></button>
            </template>
          </div>
          <form @submit.prevent="addNewCategory()" class="mt-3 flex gap-2">
            <input
              type="text"
              x-model="newCategory"
              placeholder="New category (e.g. Food, Duolingo Ch.1)"
              class="flex-1 px-3 py-2 rounded-lg border border-slate-300 text-sm" />
            <button type="submit" class="px-4 py-2 rounded-lg bg-slate-800 text-white text-sm font-medium">Add</button>
          </form>

          <div class="mt-6 flex gap-2">
            <button @click="closeModal()" class="flex-1 px-4 py-3 rounded-xl bg-slate-100 text-slate-700 font-medium">Cancel</button>
            <button @click="save()" :disabled="saving"
                    class="flex-1 px-4 py-3 rounded-xl bg-blue-600 text-white font-medium disabled:opacity-50">
              <span x-show="!saving">Save to Notebook</span>
              <span x-show="saving">Saving…</span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <div x-show="toast" x-cloak x-transition
       class="fixed top-4 left-1/2 -translate-x-1/2 z-30 bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-lg"
       x-text="toast"></div>

  <nav class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 w-full max-w-xl mx-auto flex">
    <button @click="view = 'add'"
            :class="view === 'add' ? 'text-blue-600' : 'text-slate-500'"
            class="flex-1 py-4 text-sm font-semibold transition-colors">Add</button>
    <button @click="goBank()"
            :class="view === 'bank' ? 'text-blue-600' : 'text-slate-500'"
            class="flex-1 py-4 text-sm font-semibold transition-colors">Bank</button>
  </nav>

</main>
</body>
</html>
